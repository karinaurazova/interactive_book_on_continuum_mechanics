name: deploy-pages

on:
  push:
    branches:
      - v0.7-finite-strain-hyperelasticity
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Kinematics sanity checks
        run: npm run test:kinematics

      - name: Transport sanity checks
        run: npm run test:transport

      - name: Balance-law sanity checks
        run: npm run test:balance

      - name: Constitutive sanity checks
        run: npm run test:constitutive

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
