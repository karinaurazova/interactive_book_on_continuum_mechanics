name: prototype-ci

on:
  push:
    branches:
      - v0.1-foundation
      - v0.2-platform
      - v0.3-kinematics
      - v0.3.1-hardening
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Kinematics sanity checks
        run: npm run test:kinematics

      - name: Build
        run: npm run build
